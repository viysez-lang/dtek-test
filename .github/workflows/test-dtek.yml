
name: DTEK outage alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dtek-outage-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dtek-blackout-client playwright
          python -m playwright install --with-deps chromium

      - name: Check schedules and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timedelta, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi.requests import AsyncSession
          from dtek_client import DtekClient
          from dtek_client.browser_auth import get_cleared_cookies

          CITY = "м. Дніпро"
          STREET = "просп. Героїв"
          HOUSE = "1/Б"
          STATE_FILE = Path("alert_state.json")
          KYIV = ZoneInfo("Europe/Kyiv")

          def send_telegram(message):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = os.environ["TELEGRAM_CHAT_ID"]

              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": message,
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if not result.get("ok"):
                  raise RuntimeError(f"Telegram error: {result}")

          async def get_schedules():
              base = "https://www.dtek-dnem.com.ua"
              url = base + "/ua/shutdowns"

              print("Opening DTEK...")
              cookies, csrf_token = await get_cleared_cookies(url)

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "uk,en;q=0.9",
                  "Origin": base,
                  "Referer": url,
                  "X-Requested-With": "XMLHttpRequest",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              }

              if csrf_token:
                  headers["X-CSRF-Token"] = csrf_token

              async with DtekClient(
                  "dnem",
                  ajax_url=base + "/ua/ajax",
                  session=AsyncSession(
                      timeout=30,
                      headers=headers,
                      cookies=cookies,
                      impersonate="chrome120",
                  ),
              ) as client:
                  response = await client.get_home_num(CITY, STREET)

                  if HOUSE not in response.houses:
                      raise RuntimeError(f"House not found: {HOUSE}")

                  entry = response.houses[HOUSE]

                  if entry.is_excluded:
                      raise RuntimeError("House is excluded from the schedule")

                  group = entry.primary_group
                  print("House:", HOUSE, "Group:", group)

                  dates = DtekClient.get_available_fact_dates(response)
                  dates = sorted(d for d in dates if d >= datetime.now(KYIV).date())

                  print("Published schedule dates:", dates)

                  schedules = []

                  for schedule_date in dates:
                      schedule = await client.get_schedule_for_date(
                          CITY, STREET, HOUSE, schedule_date
                      )

                      if schedule:
                          schedules.append((schedule_date, schedule))
                          print(f"Schedule received for {schedule_date}")
                      else:
                          print(f"No confirmed schedule for {schedule_date}")

              return schedules, group

          def find_outages(schedules):
              intervals = []

              for schedule_date, schedule in schedules:
                  midnight = datetime.combine(
                      schedule_date, time.min, tzinfo=KYIV
                  )

                  for slot, raw_status in schedule.items():
                      hour = int(slot)
                      start = midnight + timedelta(hours=hour - 1)

                      status = str(
                          getattr(raw_status, "value", raw_status)
                      ).lower()

                      if status == "no":
                          end = start + timedelta(hours=1)
                      elif status == "first":
                          end = start + timedelta(minutes=30)
                      elif status == "second":
                          start += timedelta(minutes=30)
                          end = start + timedelta(minutes=30)
                      else:
                          # Не отправляем предупреждения по сомнительным
                          # или неизвестным статусам.
                          continue

                      intervals.append((start, end))

              intervals.sort(key=lambda item: item[0])
              merged = []

              for start, end in intervals:
                  if merged and start <= merged[-1][1]:
                      merged[-1] = (
                          merged[-1][0],
                          max(merged[-1][1], end),
                      )
                  else:
                      merged.append((start, end))

              return merged

          def save_state(state):
              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  ["git", "config", "user.email",
                   "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(["git", "add", str(STATE_FILE)], check=True)

              changed = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              ).returncode != 0

              if changed:
                  subprocess.run(
                      ["git", "commit", "-m", "Update DTEK alert state"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "push", "origin",
                       f"HEAD:{os.environ['GITHUB_REF_NAME']}"],
                      check=True,
                  )

          async def main():
              now = datetime.now(KYIV)
              print("Kyiv time:", now.isoformat())

              schedules, group = await get_schedules()
              outages = find_outages(schedules)

              state = {"alerted": []}

              if STATE_FILE.exists():
                  try:
                      state = json.loads(
                          STATE_FILE.read_text(encoding="utf-8")
                      )
                  except (OSError, json.JSONDecodeError):
                      print("Could not read saved state; starting fresh.")

              cutoff = (now.date() - timedelta(days=7)).isoformat()
              state["alerted"] = [
                  key for key in state.get("alerted", [])
                  if key[:10] >= cutoff
              ]

              for start, end in outages:
                  minutes = (start - now).total_seconds() / 60
                  key = start.strftime("%Y-%m-%d %H:%M")

                  print(
                      f"Outage {start:%Y-%m-%d %H:%M}-"
                      f"{end:%H:%M}; starts in {minutes:.1f} minutes"
                  )

                  if 0 < minutes <= 25 and key not in state["alerted"]:
                      message = (
                          "⚠️ УВАГА: скоро відключення світла!\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Група: {group}\n"
                          f"Дата: {start:%d.%m.%Y}\n"
                          f"Початок: {start:%H:%M}\n"
                          f"Орієнтовне завершення: {end:%H:%M}\n\n"
                          "Підготуйтеся заздалегідь."
                      )

                      send_telegram(message)
                      print("Telegram alert sent:", key)
                      state["alerted"].append(key)

              save_state(state)

              if not schedules:
                  print("No published schedules for upcoming dates.")

          asyncio.run(main())
          PY
