
name: Test DTEK access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dtek-blackout-client playwright
          python -m playwright install --with-deps chromium

      - name: Test DTEK and Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import urllib.request

          from curl_cffi.requests import AsyncSession
          from dtek_client import DtekClient
          from dtek_client.browser_auth import get_cleared_cookies

          async def main():
              base = "https://www.dtek-dnem.com.ua"
              url = base + "/ua/shutdowns"

              print("Opening DTEK with Chromium...")
              cookies, token = await get_cleared_cookies(url)

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "uk,en;q=0.9",
                  "Origin": base,
                  "Referer": url,
                  "X-Requested-With": "XMLHttpRequest",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              }

              if token:
                  headers["X-CSRF-Token"] = token

              async with DtekClient(
                  "dnem",
                  ajax_url=base + "/ua/ajax",
                  session=AsyncSession(
                      timeout=20,
                      headers=headers,
                      cookies=cookies,
                      impersonate="chrome120",
                  ),
              ) as client:

                  response = await client.get_home_num(
                      "м. Дніпро", "просп. Героїв"
                  )

                  print("Houses received:", len(response.houses))

                  house = "1/Б"

                  if house not in response.houses:
                      raise RuntimeError(
                          f"House {house} not found. "
                          f"Available houses: {list(response.houses.keys())[:30]}"
                      )

                  entry = response.houses[house]

                  print("SELECTED HOUSE:", house)
                  print("GROUP:", entry.primary_group)
                  print("EXCLUDED:", entry.is_excluded)

                  schedule = await client.get_today_schedule(
                      "м. Дніпро", "просп. Героїв", house
                  )

                  print("TODAY SCHEDULE:", schedule)

              telegram_token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = os.environ["TELEGRAM_CHAT_ID"]

              message = (
                  "✅ Тест пройден!\n"
                  "Бот ДТЕК Дніпро подключён.\n\n"
                  "Адрес: просп. Героїв, 1/Б\n"
                  f"Группа: {entry.primary_group}\n"
                  "График ДТЭК успешно получен."
              )

              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": message,
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{telegram_token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=15) as result:
                  telegram_result = json.loads(result.read().decode("utf-8"))

              if not telegram_result.get("ok"):
                  raise RuntimeError(
                      f"Telegram API error: {telegram_result}"
                  )

              print("TELEGRAM MESSAGE SENT SUCCESSFULLY")

          asyncio.run(main())
          PY
