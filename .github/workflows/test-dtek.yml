name: Test DTEK access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dtek-blackout-client playwright
          python -m playwright install --with-deps chromium

      - name: Test DTEK
        run: |
          python - <<'PY'
          import asyncio
          from curl_cffi.requests import AsyncSession
          from dtek_client import DtekClient
          from dtek_client.browser_auth import get_cleared_cookies

          async def main():
              base = "https://www.dtek-dnem.com.ua"
              url = base + "/ua/shutdowns"

              print("Opening DTEK with Chromium...")
              cookies, token = await get_cleared_cookies(url)

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "uk,en;q=0.9",
                  "Origin": base,
                  "Referer": url,
                  "X-Requested-With": "XMLHttpRequest",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              }
              if token:
                  headers["X-CSRF-Token"] = token

              async with DtekClient(
                  "dnem",
                  ajax_url=base + "/ua/ajax",
                  session=AsyncSession(
                      timeout=20,
                      headers=headers,
                      cookies=cookies,
                      impersonate="chrome120",
                  ),
              ) as client:
                  response = await client.get_home_num(
                      "м. Дніпро", "просп. Героїв"
                  )

                  print("Houses received:", len(response.houses))

                  for house, entry in sorted(response.houses.items()):
                      if house.upper().replace(" ", "") in ("1Б", "1БК"):
                          print("HOUSE:", house)
                          print("GROUP:", entry.primary_group)
                          print("EXCLUDED:", entry.is_excluded)

                  if not response.houses:
                      raise RuntimeError("DTEK returned no houses")

          asyncio.run(main())
          PY
