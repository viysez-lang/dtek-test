
name: DTEK outage alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dtek-outage-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install dtek-blackout-client playwright
          python -m playwright install --with-deps chromium

      - name: Check schedule and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi.requests import AsyncSession
          from dtek_client import DtekClient
          from dtek_client.browser_auth import get_cleared_cookies

          CITY = "м. Дніпро"
          STREET = "просп. Героїв"
          HOUSE = "1/Б"
          STATE_FILE = Path("alert_state.json")
          KYIV = ZoneInfo("Europe/Kyiv")

          def send_telegram(message):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = os.environ["TELEGRAM_CHAT_ID"]

              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": message,
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if not result.get("ok"):
                  raise RuntimeError(f"Telegram error: {result}")

          async def get_schedule():
              base = "https://www.dtek-dnem.com.ua"
              url = base + "/ua/shutdowns"

              print("Opening DTEK...")
              cookies, csrf_token = await get_cleared_cookies(url)

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "uk,en;q=0.9",
                  "Origin": base,
                  "Referer": url,
                  "X-Requested-With": "XMLHttpRequest",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              }

              if csrf_token:
                  headers["X-CSRF-Token"] = csrf_token

              async with DtekClient(
                  "dnem",
                  ajax_url=base + "/ua/ajax",
                  session=AsyncSession(
                      timeout=30,
                      headers=headers,
                      cookies=cookies,
                      impersonate="chrome120",
                  ),
              ) as client:
                  response = await client.get_home_num(CITY, STREET)

                  if HOUSE not in response.houses:
                      raise RuntimeError(f"House not found: {HOUSE}")

                  entry = response.houses[HOUSE]

                  if entry.is_excluded:
                      raise RuntimeError("House is excluded from the schedule")

                  print("House:", HOUSE)
                  print("Group:", entry.primary_group)

                  schedule = await client.get_today_schedule(
                      CITY, STREET, HOUSE
                  )

                  if not schedule:
                      raise RuntimeError("DTEK returned no schedule")

                  return schedule, entry.primary_group

          def find_outages(schedule, now):
              midnight = now.replace(
                  hour=0, minute=0, second=0, microsecond=0
              )

              intervals = []

              for slot, raw_status in schedule.items():
                  hour = int(slot)
                  start = midnight + timedelta(hours=hour - 1)
                  status = str(
                      getattr(raw_status, "value", raw_status)
                  ).lower()

                  if status == "no":
                      intervals.append(
                          (start, start + timedelta(hours=1))
                      )
                  elif status == "first":
                      intervals.append(
                          (start, start + timedelta(minutes=30))
                      )
                  elif status == "second":
                      intervals.append((
                          start + timedelta(minutes=30),
                          start + timedelta(hours=1),
                      ))
                  elif status in ("maybe", "mfirst", "msecond", "unknown"):
                      print(f"Unconfirmed slot {slot}: {status}")

              intervals.sort(key=lambda item: item[0])
              merged = []

              for start, end in intervals:
                  if merged and start <= merged[-1][1]:
                      merged[-1] = (
                          merged[-1][0],
                          max(merged[-1][1], end),
                      )
                  else:
                      merged.append((start, end))

              return merged

          def save_alert(key, state):
              state["alerted"] = [
                  item for item in state.get("alerted", [])
                  if item[:10] >= (datetime.now(KYIV).date() - timedelta(days=7)).isoformat()
              ]

              if key not in state["alerted"]:
                  state["alerted"].append(key)

              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  ["git", "config", "user.email",
                   "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(
                  ["git", "add", str(STATE_FILE)],
                  check=True,
              )

              changed = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              ).returncode != 0

              if changed:
                  subprocess.run(
                      ["git", "commit", "-m", "Update DTEK alert state"],
                      check=True,
                  )
                  branch = os.environ["GITHUB_REF_NAME"]
                  subprocess.run(
                      ["git", "push", "origin", f"HEAD:{branch}"],
                      check=True,
                  )

          async def main():
              now = datetime.now(KYIV)
              print("Kyiv time:", now.isoformat())

              schedule, group = await get_schedule()
              print("Today's schedule:", schedule)

              outages = find_outages(schedule, now)

              state = {"alerted": []}
              if STATE_FILE.exists():
                  try:
                      state = json.loads(
                          STATE_FILE.read_text(encoding="utf-8")
                      )
                  except (json.JSONDecodeError, OSError):
                      print("Could not read alert state; starting fresh.")

              for start, end in outages:
                  minutes = (start - now).total_seconds() / 60
                  key = start.strftime("%Y-%m-%d %H:%M")

                  print(
                      f"Outage {start:%H:%M}-{end:%H:%M}; "
                      f"starts in {minutes:.1f} minutes"
                  )

                  if 0 < minutes <= 30 and key not in state["alerted"]:
                      message = (
                          "⚠️ УВАГА: скоро відключення світла!\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Група: {group}\n"
                          f"Початок: {start:%H:%M}\n"
                          f"Орієнтовне завершення: {end:%H:%M}\n\n"
                          "Підготуйтеся заздалегідь."
                      )

                      send_telegram(message)
                      print("Telegram alert sent:", key)

                      save_alert(key, state)
                      state["alerted"].append(key)

          asyncio.run(main())
          PY
