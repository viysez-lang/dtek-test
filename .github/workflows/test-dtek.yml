
name: DTEK outage alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: dtek-outage-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dtek-blackout-client playwright
          python -m playwright install --with-deps chromium

      - name: Check schedules and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import asyncio
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timedelta, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi.requests import AsyncSession
          from dtek_client import DtekClient
          from dtek_client.browser_auth import get_cleared_cookies

          CITY = "м. Дніпро"
          STREET = "просп. Героїв"
          HOUSE = "1/Б"
          STATE_FILE = Path("alert_state.json")
          KYIV = ZoneInfo("Europe/Kyiv")

          def send_telegram(message):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_ids = [
                  os.environ["TELEGRAM_CHAT_ID"],
                  os.environ["TELEGRAM_CHAT_ID_2"],
              ]

              errors = []

              for chat_id in chat_ids:
                  try:
                      payload = json.dumps({
                          "chat_id": chat_id,
                          "text": message,
                      }).encode("utf-8")

                      request = urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data=payload,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )

                      with urllib.request.urlopen(request, timeout=20) as response:
                          result = json.loads(response.read().decode("utf-8"))

                      if not result.get("ok"):
                          raise RuntimeError(f"Telegram error: {result}")

                  except Exception as e:
                      errors.append(f"{chat_id}: {e}")

              if errors:
                  raise RuntimeError("Помилка надсилання: " + "; ".join(errors))
          def check_emergency_outage(entry, state):
              """Check emergency outage data without changing schedule logic."""
              state_key = "known_emergency_outage"

              sub_type = (entry.sub_type or "").strip()
              start_date = (entry.start_date or "").strip()
              end_date = (entry.end_date or "").strip()
              outage_type = str(entry.outage_type or "").strip()

              # An entirely empty record means DTEK no longer shows an outage.
              if not any((sub_type, start_date, end_date, outage_type)):
                  current = None
              # Incomplete data must not trigger a false start/end/update alert.
              elif not (sub_type and start_date and end_date):
                  print("Emergency data is incomplete; keeping previous state.")
                  return
              else:
                  current = {
                      "sub_type": sub_type,
                      "start_date": start_date,
                      "end_date": end_date,
                      "outage_type": outage_type,
                  }

              # First run: save a baseline without sending an old-outage alert.
              if state_key not in state:
                  state[state_key] = current
                  print("Emergency outage baseline saved; no notification.")
                  return

              previous = state[state_key]

              if previous == current:
                  print("Emergency outage data unchanged.")
                  return

              if previous is None and current is not None:
                  message = (
                      "🚨 АВАРІЙНЕ ВІДКЛЮЧЕННЯ!\n\n"
                      f"Адреса: {STREET}, {HOUSE}\n"
                      f"Група: {entry.primary_group}\n"
                      f"Причина: {current['sub_type']}\n"
                      f"Початок: {current['start_date']}\n"
                      f"Орієнтовне відновлення: {current['end_date']}"
                  )
                  send_telegram(message)
                  print("New emergency outage notification sent.")

              elif previous is not None and current is None:
                  message = (
                      "ℹ️ ДТЕК більше не відображає аварійне відключення "
                      "за вашою адресою.\n\n"
                      f"Адреса: {STREET}, {HOUSE}\n"
                      f"Попередній орієнтовний час відновлення: "
                      f"{previous['end_date']}\n\n"
                      "Це означає, що запис про аварію зник із даних ДТЕК; "
                      "фактичну появу електроенергії варто перевірити."
                  )
                  send_telegram(message)
                  print("Emergency outage disappearance notification sent.")

              else:
                  if previous.get("end_date") != current["end_date"]:
                      message = (
                          "🔄 ДТЕК змінив орієнтовний час відновлення "
                          "після аварійного відключення.\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Було: {previous['end_date']}\n"
                          f"Стало: {current['end_date']}\n"
                          f"Причина: {current['sub_type']}"
                      )
                  else:
                      message = (
                          "🔄 ДТЕК оновив дані аварійного відключення.\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Причина: {current['sub_type']}\n"
                          f"Початок: {current['start_date']}\n"
                          f"Орієнтовне відновлення: {current['end_date']}"
                      )
                  send_telegram(message)
                  print("Emergency outage update notification sent.")

              # Update state only after successful Telegram delivery.
              state[state_key] = current


          async def get_schedules():
              base = "https://www.dtek-dnem.com.ua"
              url = base + "/ua/shutdowns"

              print("Opening DTEK...")
              cookies, csrf_token = await get_cleared_cookies(url)

              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Language": "uk,en;q=0.9",
                  "Origin": base,
                  "Referer": url,
                  "X-Requested-With": "XMLHttpRequest",
                  "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
              }

              if csrf_token:
                  headers["X-CSRF-Token"] = csrf_token

              async with DtekClient(
                  "dnem",
                  ajax_url=base + "/ua/ajax",
                  session=AsyncSession(
                      timeout=30,
                      headers=headers,
                      cookies=cookies,
                      impersonate="chrome120",
                  ),
              ) as client:
                  response = await client.get_home_num(CITY, STREET)

                  if HOUSE not in response.houses:
                      raise RuntimeError(f"House not found: {HOUSE}")

                  entry = response.houses[HOUSE]

                  if entry.is_excluded:
                      raise RuntimeError("House is excluded from the schedule")

                  group = entry.primary_group
                  print("House:", HOUSE, "Group:", group)

                  dates = DtekClient.get_available_fact_dates(response)
                  today = datetime.now(KYIV).date()
                  dates = sorted(d for d in dates if d >= today)

                  print("Published schedule dates:", dates)

                  schedules = []

                  for schedule_date in dates:
                      schedule = await client.get_schedule_for_date(
                          CITY, STREET, HOUSE, schedule_date
                      )

                      if schedule:
                          statuses = {
                              str(slot): str(
                                  getattr(status, "value", status)
                              ).lower()
                              for slot, status in schedule.items()
                          }
                          schedules.append((schedule_date, statuses))
                          print(f"Schedule received for {schedule_date}")
                      else:
                          print(f"No schedule returned for {schedule_date}")

              return schedules, group, entry

          def outage_intervals(schedule_date, statuses):
              midnight = datetime.combine(
                  schedule_date, time.min, tzinfo=KYIV
              )
              intervals = []

              for slot, status in statuses.items():
                  start = midnight + timedelta(hours=int(slot) - 1)

                  if status == "no":
                      end = start + timedelta(hours=1)
                  elif status == "first":
                      end = start + timedelta(minutes=30)
                  elif status == "second":
                      start += timedelta(minutes=30)
                      end = start + timedelta(minutes=30)
                  else:
                      continue

                  intervals.append((start, end))

              intervals.sort(key=lambda pair: pair[0])
              merged = []

              for start, end in intervals:
                  if merged and start <= merged[-1][1]:
                      merged[-1] = (
                          merged[-1][0],
                          max(merged[-1][1], end),
                      )
                  else:
                      merged.append((start, end))

              return merged

          def describe_schedule(schedule_date, statuses):
              intervals = outage_intervals(schedule_date, statuses)

              if not intervals:
                  return "В отриманому графіку відключення не зазначені."

              lines = [
                  f"• {start:%H:%M}–{end:%H:%M}"
                  for start, end in intervals
              ]
              return "Планові відключення:\n" + "\n".join(lines)

          def save_state(state):
              STATE_FILE.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  ["git", "config", "user.email",
                   "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(["git", "add", str(STATE_FILE)], check=True)

              changed = subprocess.run(
                  ["git", "diff", "--cached", "--quiet"]
              ).returncode != 0

              if changed:
                  subprocess.run(
                      ["git", "commit", "-m", "Update DTEK alert state"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "push", "origin",
                       f"HEAD:{os.environ['GITHUB_REF_NAME']}"],
                      check=True,
                  )

          async def main():
              now = datetime.now(KYIV)
              print("Kyiv time:", now.isoformat())

              schedules, group, entry = await get_schedules()

              state = {"alerted": []}
              if STATE_FILE.exists():
                  try:
                      state = json.loads(
                          STATE_FILE.read_text(encoding="utf-8")
                      )
                  except (OSError, json.JSONDecodeError):
                      print("Could not read saved state; starting fresh.")

              state.setdefault("alerted", [])

              # Independent emergency-outage notifications.
              check_emergency_outage(entry, state)

              previous = state.get("known_schedules")
              current = {}

              for schedule_date, statuses in schedules:
                  fingerprint = hashlib.sha256(
                      json.dumps(
                          statuses, sort_keys=True
                      ).encode("utf-8")
                  ).hexdigest()

                  date_key = schedule_date.isoformat()
                  current[date_key] = {
                      "fingerprint": fingerprint,
                      "statuses": statuses,
                  }

                  if previous is None:
                      print(
                          f"Initial baseline for {date_key}; "
                          "no publication notification."
                      )
                  elif date_key not in previous:
                      message = (
                          "📅 ДТЕК опублікував новий графік!\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Група: {group}\n"
                          f"Дата графіка: {schedule_date:%d.%m.%Y}\n\n"
                          f"{describe_schedule(schedule_date, statuses)}"
                      )
                      send_telegram(message)
                      print("New schedule notification sent:", date_key)

                  elif previous[date_key].get("fingerprint") != fingerprint:
                      message = (
                          "🔄 ДТЕК змінив графік відключень!\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Група: {group}\n"
                          f"Дата графіка: {schedule_date:%d.%m.%Y}\n\n"
                          f"{describe_schedule(schedule_date, statuses)}"
                      )
                      send_telegram(message)
                      print("Schedule update notification sent:", date_key)

              cutoff = (
                  now.date() - timedelta(days=7)
              ).isoformat()

              state["alerted"] = [
                  key for key in state["alerted"]
                  if key[:10] >= cutoff
              ]

              all_outages = []

              for date_key, item in current.items():
                  schedule_date = datetime.strptime(
                      date_key, "%Y-%m-%d"
                  ).date()

                  all_outages.extend(
                      outage_intervals(schedule_date, item["statuses"])
                  )

              for start, end in sorted(all_outages):
                  minutes = (start - now).total_seconds() / 60
                  key = start.strftime("%Y-%m-%d %H:%M")

                  print(
                      f"Outage {start:%Y-%m-%d %H:%M}-"
                      f"{end:%H:%M}; starts in {minutes:.1f} minutes"
                  )

                  if 0 < minutes <= 25 and key not in state["alerted"]:
                      message = (
                          "⚠️ УВАГА: скоро відключення світла!\n\n"
                          f"Адреса: {STREET}, {HOUSE}\n"
                          f"Група: {group}\n"
                          f"Дата: {start:%d.%m.%Y}\n"
                          f"Початок: {start:%H:%M}\n"
                          f"Орієнтовне завершення: {end:%H:%M}\n\n"
                          "Підготуйтеся заздалегідь."
                      )

                      send_telegram(message)
                      state["alerted"].append(key)
                      print("Outage alert sent:", key)

              state["known_schedules"] = current
              save_state(state)

              if not schedules:
                  print("No published schedules for upcoming dates.")

          asyncio.run(main())
          PY
